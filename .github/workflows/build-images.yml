name: Build and publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [oidc, saml]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional Docker Hub: set repo variable DOCKERHUB_NAMESPACE and secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_NAMESPACE != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')"
          imgs="ghcr.io/${owner}/idp-demo-${{ matrix.app }}"
          if [ -n "${{ vars.DOCKERHUB_NAMESPACE }}" ]; then
            imgs="${imgs}"$'\n'"${{ vars.DOCKERHUB_NAMESPACE }}/idp-demo-${{ matrix.app }}"
          fi
          { echo 'images<<EOF'; echo "$imgs"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=
          labels: |
            org.opencontainers.image.title=idp-demo-${{ matrix.app }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}-app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
